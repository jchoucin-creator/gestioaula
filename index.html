<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gestió d'aula</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  /* Pàgina d'inici del repositori: una llista d'eines */
  --paper: #f3f5fa; --panel: #ffffff; --ink: #16203a; --muted: #5d6680; --line: #dde2ee; --accent: #ff5a36;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root { --paper: #0f1424; --panel: #171e33; --ink: #eef1f8; --muted: #a2abc4; --line: #2a3350; color-scheme: dark; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--body); line-height: 1.5; }
main { max-width: 760px; margin: 0 auto; padding: 56px 20px; }
h1 { font-family: var(--display); font-weight: 800; font-size: clamp(32px, 6vw, 48px); letter-spacing: -0.03em; margin: 0 0 6px; }
.lead { color: var(--muted); margin: 0 0 32px; font-size: 17px; }
.tools { display: grid; gap: 14px; }
a.tool { display: flex; gap: 16px; align-items: center; text-decoration: none; color: inherit; background: var(--panel); border: 1.5px solid var(--line); border-radius: 16px; padding: 18px 20px; transition: border-color .15s, transform .15s; }
a.tool:hover, a.tool:focus-visible { border-color: var(--accent); transform: translateY(-2px); outline: none; }
a.tool h2 { font-family: var(--display); font-weight: 800; font-size: 22px; margin: 0 0 2px; letter-spacing: -0.01em; }
a.tool p { margin: 0; color: var(--muted); font-size: 15px; }
a.tool .go { margin-left: auto; font-size: 22px; color: var(--accent); flex: none; }
footer { margin-top: 36px; font-size: 13px; color: var(--muted); }
footer a { color: inherit; }
@media (prefers-reduced-motion: reduce) { a.tool { transition: none; } }
</style>
</head>
<body>
<main>
  <h1>Gestió d'aula</h1>
  <p class="lead">Eines web per a la gestió d'aula. Funcionen al navegador i no desen dades de l'alumnat.</p>
  <div class="tools">
    <a class="tool" href="creador-grups/">
      <svg width="44" height="44" viewBox="0 0 34 34" aria-hidden="true" style="flex:none">
        <circle cx="10" cy="11" r="7" fill="#ff5a36"/><circle cx="24" cy="11" r="7" fill="#3a86ff"/>
        <circle cx="10" cy="24" r="7" fill="#2ec4b6"/><circle cx="24" cy="24" r="7" fill="#ffb627"/>
      </svg>
      <div>
        <h2>Creador de grups</h2>
        <p>Grups a l'atzar amb condicions, plànol d'aula i observació amb semàfor exportable a Excel i Google Sheets.</p>
      </div>
      <span class="go" aria-hidden="true">→</span>
    </a>
  </div>
  <footer>Codi a <a href="https://github.com/jchoucin-creator/gestioaula">github.com/jchoucin-creator/gestioaula</a></footer>
</main>
</body>
</html>
